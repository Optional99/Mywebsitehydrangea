<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>My Professional Website</title>

    <link rel="stylesheet" href="style.css">

</head>

<body style="display:none">
	<style>
 
 #siteLogo {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 100;
    height: 44px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    background: #ff6719;
    color: white;
    border-radius: 8px;
    font-family: Arial, sans-serif;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
    text-decoration: none;
    transition: 0.3s;
}

#siteLogo:hover {
    background: #e6530d;
}
	</style>
	<style>
		#profileWrap {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 100;
}

#profileIcon {
    width: 44px !important;
    height: 44px !important;
    min-width: 44px !important;
    padding: 0 !important;
    margin: 0 !important;
    border-radius: 50% !important;
    border: 2px solid #d95b16;
    background: #f36b21;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

#profileMenu {
    display: none;
    position: absolute;
    right: 0;
    top: 56px;
    width: 290px;
    max-width: calc(100vw - 24px);
    padding: 22px;
    box-sizing: border-box;
    background: #ffffff;
    color: #1e293b;
    border: 1px solid #eeeeee;
    border-radius: 16px;
    text-align: left;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.14);
}

#profileMenu.open {
    display: block;
}

#pName {
    display: block;
    font-family: Arial, sans-serif;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 5px;
}

#pEmail {
    display: block;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #777777;
    overflow-wrap: anywhere;
}

#profileMenu hr {
    border: none;
    border-top: 1px solid #eeeeee;
    margin: 16px 0;
}

#profileMenu input {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    box-sizing: border-box;
    border: 1px solid #dddddd;
    border-radius: 9px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    outline: none;
}

#profileMenu input:focus {
    border-color: #ff6719;
}

#profileMenu button {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border: none;
    border-radius: 9px;
    background: #ff6719;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

#profileMenu button:hover {
    background: #e6530d;
}

#pMsg {
    font-size: 13px;
    color: #b3261e;
    overflow-wrap: anywhere;
}

#pMsg.ok {
    color: #1b6e3a;
}
   </style>

<div id="profileWrap">
  <button id="profileIcon" type="button">?</button>
  <div id="profileMenu">
    <strong id="pName"></strong><br>
    <span id="pEmail"></span>
    <hr>
    <input id="newName" type="text" placeholder="Change name">
    <button id="saveName" type="button">Save name</button>
    <button id="resetPw" type="button">Send password reset email</button>
	  <a id="adminLink" href="admin.html" style="display:none; margin-top:10px; padding:10px; box-sizing:border-box; text-align:center; border:2px solid #ff6719; border-radius:9px; color:#ff6719; font-family:Arial,sans-serif; font-size:14px; font-weight:bold; text-decoration:none;">Admin page</a>
    <button id="logoutBtn" type="button">Log out</button>
    <p id="pMsg"></p>
  </div>
</div>
   <a id="siteLogo" href="index.html">OPTIONAL</a>
	
    
<main>

    <section class="homeHero">
        <h1>Share Your World.</h1>

        <p>
            A place to discover, share and appreciate
            photography from people around the world.
        </p>

        <a href="upload.html" class="uploadlink">
            + Upload Photo
        </a>
    </section>
	<section class="gallerySection">

    <h2>Explore Photography</h2>

    <p>Discover photographs shared by our community.</p>

    <div class="galleryGrid" id="galleryGrid">

        <!-- Approved photos will appear here from Firebase -->

        <div class="galleryEmpty">
            <h3>No photographs yet</h3>
            <p>Be the first to share your photography.</p>
        </div>

    </div>

</section>

   

</main>
	

    <script src="script.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAa6E8a49uTBczltRTctodaViIh3bz73Fc",
    authDomain: "mywebsite-login-a96b4.firebaseapp.com",
    projectId: "mywebsite-login-a96b4",
    appId: "1:878613000044:web:a22804c454648c9e5c8d49"
  });
	var auth = firebase.auth();
	var db = firebase.firestore();
var $ = function (id) { return document.getElementById(id); };

function msg(text, ok) {
  $("pMsg").textContent = text;
  $("pMsg").className = ok ? "ok" : "";
}

auth.onAuthStateChanged(function (user) {
  if (user) {
    document.body.style.display = "";
    var name = user.displayName || user.email;
    $("pName").textContent = user.displayName || "(no name)";
    $("pEmail").textContent = user.email;
    $("profileIcon").textContent = name.charAt(0).toUpperCase();
    $("newName").value = user.displayName || "";
  } else {
    window.location.href = "login.html";
  }
});

$("profileIcon").onclick = function () {
  $("profileMenu").classList.toggle("open");
};

document.addEventListener("click", function (e) {
  if (!$("profileWrap").contains(e.target)) {
    $("profileMenu").classList.remove("open");
  }
});

$("saveName").onclick = function () {
  var n = $("newName").value.trim();
  if (!n) { msg("Enter a name.", false); return; }
  auth.currentUser.updateProfile({ displayName: n })
    .then(function () {
      $("pName").textContent = n;
      $("profileIcon").textContent = n.charAt(0).toUpperCase();
      msg("Name saved.", true);
    })
    .catch(function (e) { msg(e.message, false); });
};

$("resetPw").onclick = function () {
  auth.sendPasswordResetEmail(auth.currentUser.email)
    .then(function () { msg("Reset email sent. Check your inbox.", true); })
    .catch(function (e) { msg(e.message, false); });
};

$("logoutBtn").onclick = function () { auth.signOut(); };
</script>

</body>

</html>
