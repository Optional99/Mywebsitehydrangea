<body style="display:none">
	<style>
  @import url('https://fonts.googleapis.com/css2?family=Antonio:wght@700&display=swap');
  #siteLogo {
    position: fixed; top: 12px; left: 12px; z-index: 100;
    height: 44px; padding: 0 18px; display: flex; align-items: center;
    background: #87ceeb; color: #000; border-radius: 22px;
    font-family: 'Antonio', Arial, sans-serif; font-size: 22px; font-weight: 700;
    letter-spacing: 3px; text-decoration: none;
  }
	</style>
	<style>
  #profileWrap { position: fixed; top: 12px; right: 12px; z-index: 100; }
#profileIcon {
  width: 44px !important; height: 44px !important; min-width: 44px !important;
  padding: 0 !important; margin: 0 !important; border-radius: 50% !important;
  border: 2px solid #4682b4; background: #87ceeb; color: #000;
  font-size: 20px; font-weight: bold; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
  #profileMenu {
    display: none; position: absolute; right: 0; top: 54px; width: 250px;
    padding: 14px; background: #fff; color: #222; border-radius: 8px; text-align: left;
  }
  #profileMenu.open { display: block; }
  #profileMenu input { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
  #profileMenu button {
    width: 100%; margin-top: 6px; padding: 9px; border: 0; border-radius: 6px;
    background: #87ceeb; cursor: pointer;
  }
  #pMsg { font-size: 13px; color: #b3261e; }
  #pMsg.ok { color: #1b6e3a; }
</style>

<div id="profileWrap">
  <button id="profileIcon" type="button">?</button>
  <div id="profileMenu">
    <strong id="pName"></strong><br>
    <span id="pEmail"></span>
    <hr>
    <input id="newName" type="text" placeholder="Change name">
    <button id="saveName" type="button">Save name</button>
    <button id="resetPw" type="button">Send password reset email</button>
    <button id="logoutBtn" type="button">Log out</button>
    <p id="pMsg"></p>
  </div>
</div>

    <script src="script.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAa6E8a49uTBczltRTctodaViIh3bz73Fc",
    authDomain: "mywebsite-login-a96b4.firebaseapp.com",
    projectId: "mywebsite-login-a96b4",
    appId: "1:878613000044:web:a22804c454648c9e5c8d49"
  });
	var auth = firebase.auth();
var $ = function (id) { return document.getElementById(id); };

function msg(text, ok) {
  $("pMsg").textContent = text;
  $("pMsg").className = ok ? "ok" : "";
}

auth.onAuthStateChanged(function (user) {
  if (user) {
    document.body.style.display = "";
    var name = user.displayName || user.email;
    $("pName").textContent = user.displayName || "(no name)";
    $("pEmail").textContent = user.email;
    $("profileIcon").textContent = name.charAt(0).toUpperCase();
    $("newName").value = user.displayName || "";
  } else {
    window.location.href = "login.html";
  }
});

$("profileIcon").onclick = function () {
  $("profileMenu").classList.toggle("open");
};

document.addEventListener("click", function (e) {
  if (!$("profileWrap").contains(e.target)) {
    $("profileMenu").classList.remove("open");
  }
});

$("saveName").onclick = function () {
  var n = $("newName").value.trim();
  if (!n) { msg("Enter a name.", false); return; }
  auth.currentUser.updateProfile({ displayName: n })
    .then(function () {
      $("pName").textContent = n;
      $("profileIcon").textContent = n.charAt(0).toUpperCase();
      msg("Name saved.", true);
    })
    .catch(function (e) { msg(e.message, false); });
};

$("resetPw").onclick = function () {
  auth.sendPasswordResetEmail(auth.currentUser.email)
    .then(function () { msg("Reset email sent. Check your inbox.", true); })
    .catch(function (e) { msg(e.message, false); });
};

$("logoutBtn").onclick = function () { auth.signOut(); };
</script>

</body>

</html>
