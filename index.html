  .csOverlay.open { display: flex; position: fixed; inset: 0; z-index: 250; background: rgba(0,0,0,0.5); align-items: flex-end; }
  .csSheet { width: 100%; min-height: 50vh; max-height: 75vh; display: flex; flex-direction: column; box-sizing: border-box; padding: 8px 14px 10px; background: #fff; border-radius: 16px 16px 0 0; text-align: left; font-family: Arial, sans-serif; color: #262626; }

  .csForm button, .csForm button:hover { padding: 6px 4px; border-radius: 0; background: none; color: #ff6719; font-size: 15px; font-weight: bold; }
  .csMsg { margin: 4px 0 0; font-size: 12px; color: #b3261e; }

}

<script>
firebase.initializeApp({

var auth = firebase.auth();
var db = firebase.firestore();
var $ = function (id) { return document.getElementById(id); };
var ADMIN_UID = "ONrTBmCnXXOCXANkCQIkkL3h66z1";

/* ---------- Profile menu ---------- */

function msg(text, ok) {
  $("pMsg").textContent = text;
  $("pMsg").className = ok ? "ok" : "";
}

auth.onAuthStateChanged(function (user) {
  if (user) {
    document.body.style.display = "";
    var name = user.displayName || user.email;
    $("pName").textContent = user.displayName || "(no name)";
    $("pEmail").textContent = user.email;
    $("profileIcon").textContent = name.charAt(0).toUpperCase();
    $("newName").value = user.displayName || "";
    if (user.uid === ADMIN_UID) {
      $("adminLink").style.display = "block";
    }
    loadGallery();
  } else {
    window.location.href = "login.html";
  }
});

$("profileIcon").onclick = function () {
  $("profileMenu").classList.toggle("open");
};

document.addEventListener("click", function (e) {
  if (!$("profileWrap").contains(e.target)) {
    $("profileMenu").classList.remove("open");
  }
});

$("saveName").onclick = function () {
  var n = $("newName").value.trim();
  if (!n) { msg("Enter a name.", false); return; }
  auth.currentUser.updateProfile({ displayName: n })
    .then(function () {
      $("pName").textContent = n;
      $("profileIcon").textContent = n.charAt(0).toUpperCase();
      msg("Name saved.", true);
    })
    .catch(function (e) { msg(e.message, false); });
};

$("resetPw").onclick = function () {
  auth.sendPasswordResetEmail(auth.currentUser.email)
    .then(function () { msg("Reset email sent. Check your inbox.", true); })
    .catch(function (e) { msg(e.message, false); });
};

$("logoutBtn").onclick = function () { auth.signOut(); };

/* ---------- Shared data and helpers ---------- */

var photosData = {};
var statEls = {};
var actEls = {};
var rateEls = {};
var myLikes = {};
var myRatings = {};
var currentId = null;
var unsubComments = null;
var myRating = 0;
var iLiked = false;
var csId = null;
var csUnsub = null;

function isMobile() { return window.matchMedia("(max-width: 600px)").matches; }

function avgOf(d) { return d.ratingCount ? d.ratingSum / d.ratingCount : 0; }

function statText(d) {
  var a = avgOf(d);
  return "\u2665 " + (d.likesCount || 0) + "    \u2605 " + (a ? a.toFixed(1) : "-");
}

function paintFeedActions(id) {
  var a = actEls[id];
  var d = photosData[id];
  if (!a || !d) { return; }
  var liked = !!myLikes[id];
  var avg = avgOf(d);
  a.like.textContent = (liked ? "\u2665 " : "\u2661 ") + (d.likesCount || 0);
  a.like.className = "actBtn" + (liked ? " liked" : "");
  a.rate.textContent = "\u2605 " + (avg ? avg.toFixed(1) : "-");
}

function refreshStats(id) {
  var d = photosData[id];
  if (statEls[id]) { statEls[id].textContent = statText(d); }
  paintFeedActions(id);
  if (id === currentId) {
    $("pmLikeCount").textContent = d.likesCount || 0;
    var a = avgOf(d);
    $("pmAvg").textContent = a ? a.toFixed(1) + " average (" + d.ratingCount + ")" : "No ratings yet";
  }
}

/* like / rate / comment actions, used by both the popup and the mobile feed */

function likeFor(id) {
  var user = auth.currentUser;
  var photoRef = db.collection("photos").doc(id);
  var likeRef = photoRef.collection("likes").doc(user.uid);
  return db.runTransaction(function (t) {
    return t.get(likeRef).then(function (likeDoc) {
      return t.get(photoRef).then(function (pDoc) {
        var count = pDoc.data().likesCount || 0;
        if (likeDoc.exists) {
          t.delete(likeRef);
          t.update(photoRef, { likesCount: Math.max(0, count - 1) });
          return { liked: false, count: Math.max(0, count - 1) };
        }
        t.set(likeRef, { createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        t.update(photoRef, { likesCount: count + 1 });
        return { liked: true, count: count + 1 };
      });
    });
  }).then(function (r) {
    photosData[id].likesCount = r.count;
    myLikes[id] = r.liked;
    return r;
  });
}

function rateFor(id, n) {
  var user = auth.currentUser;
  var photoRef = db.collection("photos").doc(id);
  var ratingRef = photoRef.collection("ratings").doc(user.uid);
  return db.runTransaction(function (t) {
    return t.get(ratingRef).then(function (rDoc) {
      return t.get(photoRef).then(function (pDoc) {
        var p = pDoc.data();
        var old = rDoc.exists ? rDoc.data().value : 0;
        var sum = (p.ratingSum || 0) - old + n;
        var cnt = (p.ratingCount || 0) + (rDoc.exists ? 0 : 1);
        t.set(ratingRef, { value: n, uid: user.uid });
        t.update(photoRef, { ratingSum: sum, ratingCount: cnt, averageRating: sum / cnt });
        return { sum: sum, cnt: cnt };
      });
    });
  }).then(function (r) {
    photosData[id].ratingSum = r.sum;
    photosData[id].ratingCount = r.cnt;
    myRatings[id] = n;
    return r;
  });
}

function addComment(id, text) {
  var user = auth.currentUser;
  return db.collection("photos").doc(id).collection("comments").add({
    text: text,
    uid: user.uid,
    name: user.displayName || "Anonymous",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

function listenComments(id, list, say) {
  var photoRef = db.collection("photos").doc(id);
  return photoRef.collection("comments").orderBy("createdAt").limit(100)
    .onSnapshot(function (snap) {
      list.innerHTML = "";
      if (snap.empty) {
        var none = document.createElement("p");
        none.className = "pmNone";
        none.textContent = "No comments yet. Be the first!";
        list.appendChild(none);
        return;
      }
      snap.forEach(function (c) {
        var cd = c.data();
        var row = document.createElement("div");
        row.className = "pmComment";
        var who = document.createElement("strong");
        who.textContent = cd.name || "Anonymous";
        var txt = document.createElement("span");
        txt.textContent = " " + cd.text;
        row.appendChild(who);
        row.appendChild(txt);
        var me = auth.currentUser;
        if (me && (cd.uid === me.uid || me.uid === ADMIN_UID)) {
          var del = document.createElement("button");
          del.type = "button";
          del.className = "pmDel";
          del.textContent = "Delete";
          del.onclick = function () {
            if (!confirm("Delete this comment?")) { return; }
            photoRef.collection("comments").doc(c.id).delete()
              .catch(function (e) { say(e.message); });
          };
          row.appendChild(del);
        }
        list.appendChild(row);
      });
      list.scrollTop = list.scrollHeight;
    }, function (e) { say(e.message); });
}

/* ---------- Gallery (feed) ---------- */

function loadGallery() {
  db.collection("photos").where("status", "==", "approved").limit(50).get()
    .then(function (snap) {
      if (snap.empty) { return; }
      var grid = $("galleryGrid");
      grid.innerHTML = "";
      snap.forEach(function (doc) {
        var d = doc.data();
        if (!d.imageUrl) { return; }
        photosData[doc.id] = d;

        var card = document.createElement("div");
        card.className = "photoCard";
        card.style.cssText = "background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.12); overflow:hidden; cursor:pointer;";
        card.onclick = function () { if (!isMobile()) { openPhoto(doc.id); } };

        var head = document.createElement("div");
        head.className = "postHead";
        var av = document.createElement("span");
        av.className = "postAvatar";
        av.textContent = (d.uploaderName || "?").charAt(0).toUpperCase();
        var who = document.createElement("span");
        who.className = "postName";
        who.textContent = d.uploaderName || "Unknown";
        head.appendChild(av);
        head.appendChild(who);
        card.appendChild(head);

        var img = document.createElement("img");
        img.src = d.imageUrl;
        img.alt = d.description || "Photo";
        img.style.cssText = "width:100%; display:block;";
        img.onclick = function (e) {
          if (isMobile()) { e.stopPropagation(); openFull(d.imageUrl); }
        };
        card.appendChild(img);

        var acts = document.createElement("div");
        acts.className = "postActions";

        var likeBtn = document.createElement("button");
        likeBtn.type = "button";
        likeBtn.className = "actBtn";
        likeBtn.onclick = function (e) {
          e.stopPropagation();
          likeFor(doc.id).then(function () { refreshStats(doc.id); })
            .catch(function (er) { console.log(er.message); });
        };

        var rateBtn = document.createElement("button");
        rateBtn.type = "button";
        rateBtn.className = "actBtn";
        rateBtn.onclick = function (e) { e.stopPropagation(); toggleRateRow(doc.id); };

        var comBtn = document.createElement("button");
        comBtn.type = "button";
        comBtn.className = "actBtn";
        comBtn.innerHTML = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';
        comBtn.onclick = function (e) { e.stopPropagation(); openComments(doc.id); };

        acts.appendChild(likeBtn);
        acts.appendChild(rateBtn);
        acts.appendChild(comBtn);
        card.appendChild(acts);

        var rrow = document.createElement("div");
        rrow.className = "rateRow";
        for (var si = 1; si <= 5; si++) {
          (function (n) {
            var st = document.createElement("span");
            st.className = "rateStar";
            st.textContent = "\u2605";
            st.onclick = function (e) {
              e.stopPropagation();
              rateFor(doc.id, n).then(function () { paintRateRow(doc.id); refreshStats(doc.id); })
                .catch(function (er) { console.log(er.message); });
            };
            rrow.appendChild(st);
          })(si);
        }
        card.appendChild(rrow);
        rateEls[doc.id] = rrow;

        actEls[doc.id] = { like: likeBtn, rate: rateBtn };
        paintFeedActions(doc.id);

        var me = auth.currentUser;
        if (me && isMobile()) {
          db.collection("photos").doc(doc.id).collection("likes").doc(me.uid).get()
            .then(function (s) { myLikes[doc.id] = s.exists; paintFeedActions(doc.id); })
            .catch(function () {});
        }

        var info = document.createElement("div");
        info.className = "postInfo";
        info.style.cssText = "padding:12px 12px 4px; font-family:Arial,sans-serif; font-size:14px;";
        info.textContent = (d.description || "") + (d.uploaderName ? " (
