<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Upload Your Photo</h1>
        <a href="index.html">Home</a>
    </header>

    <main class="upload-container">

        <h2>Share Your Creativity</h2>

        <form id="uploadForm">

            <label for="photo">Choose a photograph</label>

            <input
                type="file"
                id="photo"
                accept="image/jpeg,image/png,image/webp"
                required
            >

            <label for="caption">Photo description</label>

            <textarea
                id="caption"
                placeholder="Write something about your photo..."
                maxlength="500"
            ></textarea>

            <button type="submit">Upload Photo</button>

        </form>

        <p id="message"></p>

    </main>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyAa6E8a49uTBczltRTctodaViIh3bz73Fc",
  authDomain: "mywebsite-login-a96b4.firebaseapp.com",
  projectId: "mywebsite-login-a96b4",
  appId: "1:878613000044:web:a22804c454648c9e5c8d49"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

var CLOUD_NAME = "mx1cjiyc";
var UPLOAD_PRESET = "optional_uploads";
var MAX_SIZE = 10 * 1024 * 1024;
var currentUser = null;

auth.onAuthStateChanged(function (user) {
  if (!user) {
    window.location.href = "login.html";
  } else {
    currentUser = user;
  }
});

document.getElementById("uploadForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  var message = document.getElementById("message");
  var file = document.getElementById("photo").files[0];
  var caption = document.getElementById("caption").value.trim();

  if (!currentUser) {
    message.textContent = "Please log in first.";
    return;
  }
  if (!file) {
    message.textContent = "Please choose a photo.";
    return;
  }
  if (["image/jpeg", "image/png", "image/webp"].indexOf(file.type) === -1) {
    message.textContent = "Only JPG, PNG or WEBP images are allowed.";
    return;
  }
  if (file.size > MAX_SIZE) {
    message.textContent = "Photo must be smaller than 10 MB.";
    return;
  }

  message.textContent = "Uploading...";

  var formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  try {
    var res = await fetch("https://api.cloudinary.com/v1_1/" + CLOUD_NAME + "/image/upload", {
      method: "POST",
      body: formData
    });
    var data = await res.json();
    if (!res.ok) {
      throw new Error(data.error ? data.error.message : "Upload failed");
    }

    await db.collection("photos").add({
      imageUrl: data.secure_url,
      description: caption,
      uploadedBy: currentUser.uid,
      uploaderName: currentUser.displayName || "Anonymous",
      status: "pending",
      averageRating: 0,
      likesCount: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    message.textContent = "Upload successful! Your photo is waiting for admin approval.";
    document.getElementById("uploadForm").reset();
  } catch (err) {
    message.textContent = "Error: " + err.message;
  }
});
          </script>

</body>

</html>
